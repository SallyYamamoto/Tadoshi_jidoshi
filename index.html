<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🌸 Jidōshi & Tadōshi Lernseite 🌸</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

<style>
/* ------- Base design ------- */
body {
  font-family: 'Montserrat','Noto Sans JP', sans-serif;
  background: linear-gradient(135deg, #fff0f5, #ffe6f0);
  margin: 0;
  padding: 0;
  color: #4a2c40;
}

/* HEADER */
header {
  text-align: center;
  padding: 2rem 1rem 7rem; /* 下に余白 → 固定バーと重ならない */
  background: #fff5f8;
  border-bottom: 2px solid #f4c2d7;
}
header h1 {
  font-family: 'Great Vibes', cursive;
  font-size: 3rem;
  color: #b85c7a;
  margin: 0.3rem 0;
}

/* ------- FIXED CONTROL BAR ------- */
.control-bar {
  position: fixed;
  top: 0;
  width: 100%;
  z-index: 999;
  background: rgba(255,245,248,0.92);
  backdrop-filter: blur(6px);
  padding: 0.7rem 0.5rem;
  border-bottom: 2px solid #f4c2d7;
}

.controls {
  max-width: 1100px;
  margin: 0.3rem auto;
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 1rem;
}
.controls div {
  background: #fff5f8;
  padding: 0.5rem 1rem;
  border-radius: 2rem;
  box-shadow: 0 2px 6px rgba(184, 92, 122, 0.2);
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.controls button {
  padding: 0.3rem 0.8rem;
  border: none;
  border-radius: 1.5rem;
  cursor: pointer;
  font-size: 0.9rem;
  transition: 0.2s;
}
.controls button.active {
  background: #b85c7a;
  color: white;
}

/* Deutsch ボタン */
#toggleDe.active {
  background: #4578c2 !important;
  color: #fff !important;
}

/* ------- Search ------- */
.search-bar {
  text-align: center;
  margin: 7rem 0 1.5rem; /* 固定バーの高さ調整 */
}
.search-bar input {
  width: 60%;
  max-width: 400px;
  padding: 0.6rem 1rem;
  border-radius: 2rem;
  border: 2px solid #f4c2d7;
  background: #fff5f8;
}

/* ------- Cards ------- */
.container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
  gap: 2rem;
  padding: 2rem;
}

.verb-card {
  background: #fff0f5;
  border-radius: 2rem;
  border: 2px solid #f4c2d7;
  position: relative;
  padding-bottom: 1rem;
  transition: 0.3s;
}
.verb-card:hover {
  transform: translateY(-6px) rotateZ(0.3deg);
  box-shadow: 0 12px 25px rgba(255, 182, 193, 0.35);
}

.verb-header {
  display: flex;
  justify-content: space-between;
  padding: 1rem 1.5rem;
  border-bottom: 1px dotted #f4c2d7;
}

.jidoushi {
  font-size: 1.4rem;
  font-weight: 700;
  color: #b85c7a;
  text-align: left;
}
.tadoushi {
  font-size: 1.4rem;
  font-weight: 700;
  color: #4578c2;
  text-align: right;
}
.furigana {
  display: block;
  font-size: 0.85rem;
  color: #aa7999;
}

/* ----- meaning box ----- */
.meaning-wrapper {
  display: grid;
  grid-template-columns: 1fr 1fr;
  padding: 0.5rem 1.2rem;
  gap: 1rem;
  margin-top: 0.6rem;
  opacity: 0;
  max-height: 0;
  overflow: hidden;
  transition: all 0.35s ease;
}
.meaning-wrapper.show {
  opacity: 1;
  max-height: 200px;
}

.meaning-left, .meaning-right {
  background: #fff;
  padding: 0.6rem 0.8rem;
  border-radius: 1rem;
  font-weight: 600;
  font-size: 0.95rem;
}
.meaning-left {
  border: 2px dashed #e6a6c4;
  text-align: left;
  color: #b85c7a;
}
.meaning-right {
  border: 2px dashed #7aa0d8;
  text-align: right;
  color: #4578c2;
}

/* ----- Example blocks ----- */
.pair-content {
  display: grid;
  grid-template-columns: 1fr 1fr;
  padding: 1rem 1.5rem;
  gap: 1.2rem;
}

.example-box {
  background: #fff;
  border: 1px solid #f4c2d7;
  padding: 0.6rem 0.8rem;
  border-radius: 1rem;
  font-size: 0.95rem;
  cursor: pointer;
}
.right-block .example-box {
  border-color: #4578c2;
}

/* Translation hover */
.translation {
  max-height: 0;
  overflow: hidden;
  opacity: 0;
  transition: all 0.3s ease;
  background: #ffeafb;
  border-left: 3px solid #b85c7a;
  margin-top: 0.3rem;
  padding: 0 0.7rem;
  border-radius: 0.5rem;
  font-size: 0.9rem;
}
.translation.open {
  max-height: 200px;
  opacity: 1;
}

/* ------- Deutsch OFF モード ------- */
body.de-hidden .meaning-wrapper {
  max-height: 0 !important;
  opacity: 0 !important;
}
body.de-hidden .translation {
  max-height: 0 !important;
  opacity: 0 !important;
}

/* お気に入り */
.favorite {
  position: absolute;
  top: 12px;
  right: 18px;
  font-size: 1.3rem;
  color: #ddd;
  cursor: pointer;
}
.favorite.active { color: #e76f9c; }
</style>
</head>

<body class="de-hidden">

<header>
  <h1>🌸 Jidōshi & Tadōshi Lernseite 🌸</h1>
  <p>Deutsch ボタンで訳を一括表示</p>
</header>

<div class="control-bar">
  <div class="controls">
    <div>
      <span>活用形:</span>
      <button data-k="mizen1" class="active">未然1</button>
      <button data-k="mizen2">未然2</button>
      <button data-k="renyou">連用</button>
      <button data-k="shuushi">終止</button>
      <button data-k="rentai">連体</button>
      <button data-k="izen">仮定</button>
      <button data-k="meirei">命令</button>
    </div>

    <div>
      <span>表示:</span>
      <button id="toggleDe">Deutsch</button>
    </div>
  </div>
</div>

<div class="search-bar">
  <input type="text" id="search" placeholder="動詞や意味で検索..." />
</div>

<div class="container" id="verbContainer"></div>
<script>

/* -------------------------------------------------------
   JSON 読み込み
   （GitHub に Jidou_Tadou.json を置く想定）
------------------------------------------------------- */

let DATA = []; // JSON をここに格納

// GitHub の raw JSON URL に変更すること！！
const JSON_URL = "jidou_tadou.json";

/* JSON を読み込んでからページを描画 */
fetch(JSON_URL)
  .then(res => res.json())
  .then(json => {
    DATA = json;
    render();
  })
  .catch(err => console.error("JSON 読み込みエラー:", err));

/* ------------------------------------------------------- */

let currentK = "mizen1";
let showDe = false;

const container = document.getElementById("verbContainer");
const searchBox = document.getElementById("search");
const toggleDeBtn = document.getElementById("toggleDe");

/* -------------------------------------------------------
   Deutsch を ON/OFF して translate 要素を制御
------------------------------------------------------- */
function updateGermanVisibility(){
  const meaningBoxes = document.querySelectorAll(".meaning-wrapper");
  const translations = document.querySelectorAll(".translation");

  if(showDe){
    meaningBoxes.forEach(m => m.classList.add("show"));
    translations.forEach(t => t.classList.add("open"));
  } else {
    meaningBoxes.forEach(m => m.classList.remove("show"));
    translations.forEach(t => t.classList.remove("open"));
  }
}

/* -------------------------------------------------------
   描画処理 — JSON の行をカード化
------------------------------------------------------- */
function render(){
  container.innerHTML = "";
  const q = searchBox.value.toLowerCase();

  DATA.forEach(item => {
    const text = `
      ${item.jidou_kanji}${item.jidou_kana}
      ${item.tado_kanji}${item.tado_kana}
      ${item.jidou_meaning}${item.tado_meaning}
    `.toLowerCase();

    if(q && !text.includes(q)) return;

    const exJ = item[`jidou_${currentK}`];
    const exT = item[`tado_${currentK}`];
    const deJ = item[`de_jidou_${currentK}`];
    const deT = item[`de_tado_${currentK}`];

    const card = document.createElement("div");
    card.className = "verb-card";

    card.innerHTML = `
      <div class="favorite">❤</div>

      <div class="verb-header">
        <div class="jidoushi">
          ${item.jidou_kanji}
          <span class="furigana">${item.jidou_kana}</span>
        </div>
        <div class="tadoushi">
          ${item.tado_kanji}
          <span class="furigana">${item.tado_kana}</span>
        </div>
      </div>

      <div class="meaning-wrapper">
        <div class="meaning-left">${item.jidou_meaning}</div>
        <div class="meaning-right">${item.tado_meaning}</div>
      </div>

      <div class="pair-content">

        <div class="left-block">
          <div class="example-box">${exJ}</div>
          <div class="translation">${deJ}</div>
        </div>

        <div class="right-block">
          <div class="example-box">${exT}</div>
          <div class="translation">${deT}</div>
        </div>

      </div>
    `;

    /* 例文クリックで小さく開閉 */
    card.querySelectorAll(".example-box").forEach(box=>{
      box.addEventListener("click", e=>{
        e.stopPropagation();
        box.nextElementSibling.classList.toggle("open");
      });
    });

    /* お気に入り */
    card.querySelector(".favorite").addEventListener("click", e=>{
      e.stopPropagation();
      e.target.classList.toggle("active");
    });

    container.appendChild(card);
  });

  updateGermanVisibility();
}

/* -------------------------------------------------------
   活用形 switching
------------------------------------------------------- */
document.querySelectorAll("[data-k]").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    btn.parentElement.querySelectorAll("button").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    currentK = btn.dataset.k;
    render();
  });
});

/* -------------------------------------------------------
   Deutsch switching
------------------------------------------------------- */
toggleDeBtn.addEventListener("click", ()=>{
  showDe = !showDe;

  if(showDe){
    toggleDeBtn.classList.add("active");
    document.body.classList.remove("de-hidden");
  } else {
    toggleDeBtn.classList.remove("active");
    document.body.classList.add("de-hidden");
  }

  updateGermanVisibility();
});

/* -------------------------------------------------------
   search
------------------------------------------------------- */
searchBox.addEventListener("input", render);

</script>

</body>
</html>
